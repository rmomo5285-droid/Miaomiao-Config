server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name download.vpnmiao.com;

    root /var/www/download;
    server_tokens off;
    autoindex off;

    location = / {
        return 302 /download/index.html;
    }

    location = /download {
        return 302 /download/index.html;
    }

    location = /download/ {
        return 302 /download/index.html;
    }

    location = /download/index.html {
        alias /var/www/download/index.html;
        default_type text/html;
        add_header Cache-Control "no-cache";
    }

    location = /download/landing-watermark.jpg {
        alias /var/www/download/landing-watermark.jpg;
        default_type image/jpeg;
        add_header Cache-Control "public, max-age=604800, immutable";
        add_header X-Content-Type-Options "nosniff";
    }

    location = /download/stats.json {
        proxy_pass http://127.0.0.1:18765/stats;
        proxy_set_header Host $host;
        proxy_pass_request_body off;
        add_header Cache-Control "no-store";
    }

    location ~ ^/download/([^/]+\.(apk|zip|exe|dmg|deb|rpm|asc|txt))$ {
        proxy_pass http://127.0.0.1:18765;
        proxy_set_header X-Download-File $1;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
    }

    location ~ ^/__miaomiao_download/([^/]+\.(apk|zip|exe|dmg|deb|rpm|asc|txt))$ {
        internal;
        alias /var/www/download/$1;
        default_type application/octet-stream;
        add_header Cache-Control "no-cache";
        add_header Content-Disposition "attachment";
        add_header X-Content-Type-Options "nosniff";
    }

    location / {
        return 404;
    }

    ssl_certificate /etc/letsencrypt/live/download.vpnmiao.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/download.vpnmiao.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    listen [::]:80;
    server_name download.vpnmiao.com;
    return 301 https://$host$request_uri;
}
