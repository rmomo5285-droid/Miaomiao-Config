# Include this snippet inside the existing cdn.vpnmiao.com HTTPS server block.
# It intentionally leaves config.json and all download locations untouched.
location = /manifest.json {
    try_files $uri =404;
    default_type application/json;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;
}

location = /json {
    alias /var/www/cdn/manifest.json;
    default_type application/json;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;
}
