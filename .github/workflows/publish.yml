name: Publish signed manifest

on:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * *'
  push:
    branches: [main]
    paths:
      - manifest.payload.json
      - manifest-signing-public.pem
      - worker.js
      - wrangler.toml
      - ops/miaomiao-manifest-deploy
      - ops/install-vps-manifest.sh
      - ops/nginx-miaomiao-manifest.conf
      - ops/restrict-vps-deploy-key.sh
      - ops/test-vps-manifest-deploy.sh
      - scripts/decode-manifest-envelope.py
      - scripts/validate-payload.py
      - tests/test_decode_manifest_envelope.py
      - tests/test_validate_payload.py
      - .github/workflows/publish.yml

permissions:
  contents: read

concurrency:
  group: endpoint-manifest
  cancel-in-progress: false

jobs:
  expiry-audit:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact workflow commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify and audit the deployed signed manifest
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin gh-pages:refs/remotes/origin/gh-pages
          git show refs/remotes/origin/gh-pages:manifest.json > "$RUNNER_TEMP/deployed-manifest.json"
          python3 scripts/decode-manifest-envelope.py \
            "$RUNNER_TEMP/deployed-manifest.json" \
            "$RUNNER_TEMP/deployed-payload.json" \
            "$RUNNER_TEMP/deployed-signature.bin"
          openssl dgst -sha256 -verify manifest-signing-public.pem \
            -signature "$RUNNER_TEMP/deployed-signature.bin" "$RUNNER_TEMP/deployed-payload.json"
          expires=$(date --date="$(jq -r .expiresAt "$RUNNER_TEMP/deployed-payload.json")" +%s)
          now=$(date +%s)
          remaining_days=$(( (expires - now) / 86400 ))
          echo "Deployed signed endpoint manifest expires in ${remaining_days} day(s)."
          if (( remaining_days <= 30 )); then
            echo 'Renew manifest.payload.json, increment version, sign, and deploy it.' >&2
            exit 1
          fi

  sign-and-publish:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    environment: manifest-production
    permissions:
      contents: write
    steps:
      - name: Checkout exact workflow commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify checkout
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Validate deployment tooling
        run: |
          set -euo pipefail
          bash -n ops/miaomiao-manifest-deploy
          bash -n ops/install-vps-manifest.sh
          bash -n ops/restrict-vps-deploy-key.sh
          bash -n ops/test-vps-manifest-deploy.sh
          shellcheck \
            ops/miaomiao-manifest-deploy \
            ops/install-vps-manifest.sh \
            ops/restrict-vps-deploy-key.sh \
            ops/test-vps-manifest-deploy.sh
          python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Reject committed private material
        shell: bash
        run: |
          set -euo pipefail
          if git grep -I -n -E -e '-----BEGIN ([A-Z ]+ )?PRIVATE KEY-----'; then
            echo 'A private key appears to be tracked by Git.' >&2
            exit 1
          fi
          if git ls-files | grep -E -i '(^|/)[^/]*(private[-_]?key|signing[-_]?key|passphrase)[^/]*$'; then
            echo 'A private-key or passphrase filename appears to be tracked by Git.' >&2
            exit 1
          fi

      - name: Validate payload
        run: |
          set -euo pipefail
          python3 scripts/validate-payload.py manifest.payload.json
          test "$(wc -c < manifest.payload.json)" -le 65536
          jq -e '
            def valid_update:
              type == "object" and
              ((keys | sort) == ["build", "downloadUrl", "message", "required", "title", "version"]) and
              (.version | type == "string" and length > 0 and length <= 64 and
                test("^(0|[1-9][0-9]{0,8})\\.(0|[1-9][0-9]{0,8})\\.(0|[1-9][0-9]{0,8})$")) and
              (.build | type == "number" and . > 0 and . <= 2147483647 and floor == .) and
              (.downloadUrl | type == "string" and length > 0 and length <= 2048 and startswith("https://")) and
              (.required | type == "boolean") and
              (.title | type == "string" and length > 0 and length <= 200) and
              (.message | type == "string" and length > 0 and length <= 4000);

            (((keys - ["apiEndpoints", "bootstrapMirrors", "downloadPageUrl", "expiresAt", "issuedAt", "migrationNotice", "registrationUrl", "schema", "updates", "version"]) | length) == 0) and
            ((["apiEndpoints", "bootstrapMirrors", "downloadPageUrl", "expiresAt", "issuedAt", "registrationUrl", "schema", "version"] - keys) | length == 0) and
            .schema == 1 and
            (.version | type == "number" and . > 0 and . <= 9007199254740991 and floor == .) and
            (.issuedAt | type == "string") and
            (.expiresAt | type == "string") and
            (.apiEndpoints | type == "array" and length > 0 and length <= 8) and
            (all(.apiEndpoints[]; type == "string" and length > 0 and length <= 2048 and startswith("https://"))) and
            ((.apiEndpoints | map(ascii_downcase) | unique | length) == (.apiEndpoints | length)) and
            (.registrationUrl | type == "string" and length > 0 and length <= 2048 and startswith("https://")) and
            (.downloadPageUrl | type == "string" and length > 0 and length <= 2048 and startswith("https://")) and
            (.bootstrapMirrors | type == "array" and length > 0 and length <= 8) and
            (all(.bootstrapMirrors[]; type == "string" and length > 0 and length <= 2048 and startswith("https://"))) and
            ((.bootstrapMirrors | map(ascii_downcase) | unique | length) == (.bootstrapMirrors | length)) and
            (.migrationNotice == null or (
              (.migrationNotice | type == "object") and
              ((.migrationNotice | keys | sort) == ["autoApply", "id", "message", "required", "title"]) and
              (.migrationNotice.id | type == "string" and length > 0 and length <= 128) and
              (.migrationNotice.title | type == "string" and length > 0 and length <= 200) and
              (.migrationNotice.message | type == "string" and length > 0 and length <= 4000) and
              (.migrationNotice.autoApply == true) and
              (.migrationNotice.required | type == "boolean")
            )) and
            ((has("updates") | not) or (
              (.updates | type == "object") and
              ((.updates | keys | sort) == ["android", "desktop"]) and
              (.updates.android | valid_update) and
              (.updates.desktop | valid_update)
            ))
          ' manifest.payload.json
          issued=$(date --date="$(jq -r .issuedAt manifest.payload.json)" +%s)
          expires=$(date --date="$(jq -r .expiresAt manifest.payload.json)" +%s)
          now=$(date +%s)
          test "$expires" -gt "$issued"
          test "$issued" -le "$((now + 300))"
          test "$expires" -gt "$now"

          python3 - <<'PY'
          import ipaddress
          import json
          import re
          from datetime import datetime
          from urllib.parse import urlsplit

          with open("manifest.payload.json", "r", encoding="utf-8") as source:
              payload = json.load(source)

          def parse_timestamp(raw, name):
              try:
                  parsed = datetime.fromisoformat(raw.replace("Z", "+00:00"))
              except ValueError as error:
                  raise SystemExit(f"{name} must be RFC 3339: {error}")
              if parsed.tzinfo is None:
                  raise SystemExit(f"{name} must include a time-zone offset")
              return parsed

          def validate_url(raw, kind):
              parsed = urlsplit(raw)
              if parsed.scheme.lower() != "https" or not parsed.hostname:
                  raise SystemExit(f"{kind} must be an absolute HTTPS URL")
              if parsed.username is not None or parsed.password is not None:
                  raise SystemExit(f"{kind} must not contain user information")
              try:
                  parsed.port
              except ValueError as error:
                  raise SystemExit(f"{kind} has an invalid port: {error}")
              host = parsed.hostname.rstrip(".").lower()
              try:
                  ipaddress.ip_address(host)
              except ValueError:
                  pass
              else:
                  raise SystemExit(f"{kind} must use a public DNS host, not an IP literal")
              if "." not in host or host.endswith(".local"):
                  raise SystemExit(f"{kind} must use a public DNS host")
              if kind == "API endpoint" and (parsed.path not in ("", "/") or parsed.query or parsed.fragment):
                  raise SystemExit("API endpoint must be an HTTPS origin")
              if kind == "bootstrap mirror" and parsed.fragment:
                  raise SystemExit("bootstrap mirror must not contain a fragment")

          for endpoint in payload["apiEndpoints"]:
              validate_url(endpoint, "API endpoint")
          validate_url(payload["registrationUrl"], "registration URL")
          validate_url(payload["downloadPageUrl"], "download page URL")
          for mirror in payload["bootstrapMirrors"]:
              validate_url(mirror, "bootstrap mirror")
          if "updates" in payload:
              version_pattern = re.compile(
                  r"^(0|[1-9][0-9]{0,8})\.(0|[1-9][0-9]{0,8})\.(0|[1-9][0-9]{0,8})$"
              )
              for platform in ("android", "desktop"):
                  update = payload["updates"][platform]
                  if not version_pattern.fullmatch(update["version"]):
                      raise SystemExit(f"{platform} update version must be major.minor.patch")
                  if not update["title"].strip() or not update["message"].strip():
                      raise SystemExit(f"{platform} update title and message must not be blank")
                  validate_url(update["downloadUrl"], f"{platform} update download URL")
          issued = parse_timestamp(payload["issuedAt"], "issuedAt")
          expires = parse_timestamp(payload["expiresAt"], "expiresAt")
          if expires <= issued:
              raise SystemExit("expiresAt must be later than issuedAt")
          PY

      - name: Reject manifest rollback or same-version rewrite
        run: |
          set -euo pipefail
          set +e
          git ls-remote --exit-code --heads origin gh-pages > "$RUNNER_TEMP/gh-pages-ref"
          status=$?
          set -e
          if test "$status" -eq 0; then
            git fetch --no-tags origin gh-pages:refs/remotes/origin/gh-pages
            git cat-file -e refs/remotes/origin/gh-pages:manifest.json
            git show refs/remotes/origin/gh-pages:manifest.json \
              > "$RUNNER_TEMP/previous-manifest.json"
            python3 scripts/decode-manifest-envelope.py \
              "$RUNNER_TEMP/previous-manifest.json" \
              "$RUNNER_TEMP/previous-payload.json" \
              "$RUNNER_TEMP/previous-signature.bin"
            openssl dgst -sha256 -verify manifest-signing-public.pem \
              -signature "$RUNNER_TEMP/previous-signature.bin" \
              "$RUNNER_TEMP/previous-payload.json" >/dev/null
            previous_version=$(jq -er \
              '.version | select(type == "number" and . > 0 and floor == .) | floor' \
              "$RUNNER_TEMP/previous-payload.json")
            current_version=$(jq -r .version manifest.payload.json)
            test "$current_version" -ge "$previous_version"
            if test "$current_version" -eq "$previous_version"; then
              cmp manifest.payload.json "$RUNNER_TEMP/previous-payload.json"
            fi
          elif test "$status" -ne 2; then
            echo 'Could not verify the current gh-pages manifest version.' >&2
            exit "$status"
          fi

      - name: Restore signing key
        env:
          PRIVATE_KEY: ${{ secrets.MIAOMIAO_MANIFEST_PRIVATE_KEY }}
          KEY_PASSPHRASE: ${{ secrets.MIAOMIAO_MANIFEST_KEY_PASSPHRASE }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_KEY"
          test -n "$KEY_PASSPHRASE"
          umask 077
          printf '%s\n' "$PRIVATE_KEY" > private-key.pem
          printf '%s' "$KEY_PASSPHRASE" > passphrase.txt

      - name: Verify signing key matches embedded public key
        run: |
          set -euo pipefail
          openssl pkey -in private-key.pem -passin file:passphrase.txt -pubout -out derived-public.pem
          openssl pkey -pubin -in manifest-signing-public.pem -text -noout | grep -F 'ASN1 OID: prime256v1'
          diff -u \
            <(openssl pkey -pubin -in manifest-signing-public.pem -pubout) \
            <(openssl pkey -pubin -in derived-public.pem -pubout)

      - name: Sign exact payload bytes
        run: |
          mkdir -p public
          openssl dgst -sha256 \
            -sign private-key.pem \
            -passin file:passphrase.txt \
            -out signature.bin \
            manifest.payload.json
          jq -n \
            --arg algorithm ECDSA_P256_SHA256 \
            --arg payload "$(base64 -w0 manifest.payload.json)" \
            --arg signature "$(base64 -w0 signature.bin)" \
            '{algorithm: $algorithm, payload: $payload, signature: $signature}' \
            > public/manifest.json
          cp manifest-signing-public.pem public/
          (cd public && sha256sum manifest.json > manifest.json.sha256)

      - name: Remove private material
        if: always()
        run: rm -f private-key.pem passphrase.txt signature.bin derived-public.pem

      - name: Deploy VPS CDN mirror
        if: vars.ENABLE_VPS_DEPLOY == 'true'
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.MIAOMIAO_DEPLOY_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.MIAOMIAO_DEPLOY_SSH_KNOWN_HOSTS }}
          SSH_HOST: ${{ vars.MIAOMIAO_DEPLOY_SSH_HOST }}
          SSH_PORT: ${{ vars.MIAOMIAO_DEPLOY_SSH_PORT }}
          SSH_USER: ${{ vars.MIAOMIAO_DEPLOY_SSH_USER }}
          EXPECTED_KEY_FINGERPRINT: ${{ vars.MIAOMIAO_DEPLOY_SSH_KEY_SHA256 }}
          EXPECTED_HOST_FINGERPRINT: ${{ vars.MIAOMIAO_DEPLOY_HOST_KEY_SHA256 }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          [[ "$SSH_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$SSH_PORT" =~ ^[0-9]+$ ]] && (( SSH_PORT >= 1 && SSH_PORT <= 65535 ))
          [[ "$SSH_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "$EXPECTED_KEY_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{43}$ ]]
          [[ "$EXPECTED_HOST_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{43}$ ]]

          ssh_dir=$(mktemp -d "$RUNNER_TEMP/miaomiao-ssh.XXXXXX")
          trap 'rm -rf -- "$ssh_dir"' EXIT
          private_key="$ssh_dir/deploy-key"
          known_hosts="$ssh_dir/known_hosts"
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > "$private_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" | tr -d '\r' > "$known_hosts"
          chmod 0600 "$private_key" "$known_hosts"

          read -r deploy_key_type _ < <(ssh-keygen -y -f "$private_key")
          test "$deploy_key_type" = ssh-ed25519
          key_fingerprint=$(ssh-keygen -lf "$private_key" -E sha256 | awk '{print $2}')
          test "$key_fingerprint" = "$EXPECTED_KEY_FINGERPRINT"

          mapfile -t known_host_lines < <(sed '/^[[:space:]]*$/d' "$known_hosts")
          (( ${#known_host_lines[@]} == 1 ))
          read -r pinned_host pinned_key_type pinned_key_data pinned_extra <<< "${known_host_lines[0]}"
          test -z "${pinned_extra:-}"
          test "$pinned_key_type" = ssh-ed25519
          host_fingerprint=$(ssh-keygen -lf "$known_hosts" -E sha256 | awk 'NR == 1 {print $2}')
          test "$host_fingerprint" = "$EXPECTED_HOST_FINGERPRINT"

          known_host_target="$SSH_HOST"
          if [[ "$SSH_PORT" != 22 ]]; then
            known_host_target="[$SSH_HOST]:$SSH_PORT"
          fi
          test "$pinned_host" = "$known_host_target"
          ssh-keygen -F "$known_host_target" -f "$known_hosts" >/dev/null

          timeout --signal=TERM --kill-after=5s 45s ssh -T \
            -i "$private_key" \
            -p "$SSH_PORT" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o ConnectionAttempts=1 \
            -o HostKeyAlgorithms=ssh-ed25519 \
            -o IdentitiesOnly=yes \
            -o ServerAliveCountMax=2 \
            -o ServerAliveInterval=10 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$known_hosts" \
            "$SSH_USER@$SSH_HOST" < public/manifest.json

      - name: Deploy Cloudflare CDN mirror
        if: vars.ENABLE_CLOUDFLARE_DEPLOY == 'true'
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.118.0"
          command: deploy

      - name: Verify primary CDN mirror signature
        if: vars.ENABLE_CLOUDFLARE_DEPLOY == 'true' || vars.ENABLE_VPS_DEPLOY == 'true'
        shell: bash
        env:
          ENABLE_VPS_DEPLOY: ${{ vars.ENABLE_VPS_DEPLOY }}
          VPS_ORIGIN_IP: ${{ vars.MIAOMIAO_DEPLOY_ORIGIN_IP }}
        run: |
          set -euo pipefail
          manifest_version=$(jq -r .version manifest.payload.json)

          verify_endpoint() {
            local label=$1
            local origin_ip=${2:-}
            local prefix="$RUNNER_TEMP/$label"
            local verified=false
            local -a curl_options=(
              --fail
              --silent
              --show-error
              --connect-timeout 10
              --header 'Cache-Control: no-cache'
              --header 'Pragma: no-cache'
              --max-filesize 262144
              --max-time 20
              --proto '=https'
              --tlsv1.2
            )
            if [[ -n $origin_ip ]]; then
              curl_options+=(--resolve "cdn.vpnmiao.com:443:$origin_ip")
            fi

            for attempt in {1..12}; do
              rm -f \
                "$prefix-manifest.json" \
                "$prefix-payload.json" \
                "$prefix-signature.bin"
              if curl "${curl_options[@]}" \
                  --output "$prefix-manifest.json" \
                  "https://cdn.vpnmiao.com/manifest.json?version=${manifest_version}&attempt=${attempt}&source=${label}" &&
                python3 scripts/decode-manifest-envelope.py \
                  "$prefix-manifest.json" \
                  "$prefix-payload.json" \
                  "$prefix-signature.bin" &&
                cmp manifest.payload.json "$prefix-payload.json" &&
                openssl dgst -sha256 -verify manifest-signing-public.pem \
                  -signature "$prefix-signature.bin" "$prefix-payload.json" >/dev/null; then
                verified=true
                break
              fi
              sleep 5
            done
            test "$verified" = true
          }

          verify_endpoint cdn-public

          if [[ $ENABLE_VPS_DEPLOY == true ]]; then
            python3 - "$VPS_ORIGIN_IP" <<'PY'
          import ipaddress
          import sys

          try:
              address = ipaddress.ip_address(sys.argv[1])
          except ValueError:
              raise SystemExit("MIAOMIAO_DEPLOY_ORIGIN_IP must be an IP address") from None
          if not address.is_global:
              raise SystemExit("MIAOMIAO_DEPLOY_ORIGIN_IP must be globally routable")
          PY
            verify_endpoint vps-origin "$VPS_ORIGIN_IP"
          fi

      - name: Publish gh-pages branch
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          force_orphan: true
